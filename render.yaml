# Adsgram — один Web-сервис на Render (API + бот + сайт)
# Dashboard → New → Blueprint → tilmanziegler21-create/adsgram

services:
  - type: web
    name: adsgram
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: STATIC_DIR
        value: /app/static

# Adsgram — один Web-сервис на Render (API + бот + сайт)
# TELEGRAM_BOT_USERNAME не обязателен — username берётся из getMe по токену

services:
  - type: web
    name: adsgram
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        fromService:
          type: web
          name: adsgram
          envVarKey: RENDER_EXTERNAL_URL
      - key: STATIC_DIR
        value: /app/static
